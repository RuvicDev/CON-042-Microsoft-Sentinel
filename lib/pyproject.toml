[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-microsoft-sentinel-connector"
version = "1.0.0"
description = "Conector Ruvic para Microsoft Sentinel: listar incidentes, actualizar un incidente, y ejecutar una consulta KQL"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_microsoft_sentinel_connector*"]
